      - - [500, 500]
        - [600, 500]
        - [600, 600]
        - [500, 600]
      area_sq_meters: 50.0
    2.wmv:
      type: inclusion
      polygon:
      - [1137, 713]
      - [862, 199]
      - [502, 195]
      - [4, 565]
      - [5, 713]
      - [1135, 712]
      calibration: {front_y: 544, front_area: 49878, back_y: 336, back_area: 22932}
      exclusions:
      - - [586, 296]
        - [283, 715]
        - [431, 719]
        - [589, 414]
        - [583, 297]
      - - [843, 235]
        - [929, 377]
        - [982, 376]
        - [1002, 240]
        - [870, 124]
        - [854, 150]
        - [844, 233]
    3.wmv:
      type: inclusion
      polygon:
      - [1323, 87]
      - [690, 211]
      - [1, 530]
      - [3, 1076]
      - [1918, 1075]
      - [1904, 217]
      - [1333, 81]
      - [531, 231]
